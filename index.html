<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>벅샷 룰렛 웹 대전</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK (v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="app">
    <!-- 로비 화면 -->
    <div id="lobby-screen" class="screen">
      <h1>BUCKSHOT ROULETTE</h1>
      <p class="sub">MOBILE WEB MULTIPLAYER</p>
      <input type="text" id="player-name" placeholder="닉네임 입력" maxlength="8">
      <input type="text" id="room-code" placeholder="방 코드 (예: 1234)" maxlength="4">
      <div class="btn-group">
        <button id="btn-create">방 만들기</button>
        <button id="btn-join">입장하기</button>
      </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="screen hidden">
      <!-- 상대방 영역 -->
      <div class="player-area opponent">
        <div class="info">
          <span id="opp-name">상대방</span>
          <div id="opp-hp" class="hp-bar"></div>
        </div>
        <div id="opp-items" class="items-container"></div>
      </div>

      <!-- 중앙 샷건 및 상태 표시 -->
      <div class="center-stage">
        <div id="status-text">상대방을 기다리는 중...</div>
        <div id="bullet-info">실탄: ? | 공포탄: ?</div>
        <div id="shotgun" class="shotgun-icon">🔫</div>
      </div>

      <!-- 내 영역 및 조작 버튼 -->
      <div class="player-area my-area">
        <div id="my-items" class="items-container"></div>
        <div class="info">
          <span id="my-name">나</span>
          <div id="my-hp" class="hp-bar"></div>
        </div>
        
        <div id="action-buttons" class="action-group">
          <button id="btn-shoot-opp" class="action-btn danger" disabled>상대 발사</button>
          <button id="btn-shoot-self" class="action-btn warning" disabled>자신 발사</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
