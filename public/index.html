<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buckshot Roulette</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 🏠 1. 로비 화면 -->
    <div id="lobby-screen" class="screen">
      <h1 class="title">BUCKSHOT<br>ROULETTE</h1>
      <p class="subtitle">12게이지 산탄총으로 벌이는 목숨을 건 게임</p>

      <div class="input-container">
        <div class="input-group">
          <label for="player-name">닉네임</label>
          <input type="text" id="player-name" placeholder="닉네임을 입력하세요" />
        </div>

        <div class="input-group">
          <label for="room-code">방 코드 (멀티플레이)</label>
          <input type="text" id="room-code" placeholder="예: 1234 (미입력시 공용방)" />
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-join" class="btn-primary">🚪 방 입장 / 멀티 시작</button>
        <button id="btn-ai" class="btn-secondary">🤖 AI 딜러와 대결 (1인용)</button>
      </div>
    </div>

    <!-- ⏳ 2. 멀티플레이 대기 화면 -->
    <div id="waiting-screen" class="screen hidden" style="justify-content: center; align-items: center; text-align: center; gap: 20px;">
      <h2 class="title" style="font-size: 2rem;">상대방을 기다리는 중...</h2>
      <p id="waiting-info" class="subtitle">방 코드에서 상대 플레이어를 기다리고 있습니다.</p>
      <div class="shotgun-icon" style="animation: pulseSteal 1.5s infinite alternate;">⏳</div>
      <button id="btn-cancel-wait" class="btn-secondary" style="margin-top: 20px;">대기 취소 및 나가기</button>
    </div>

    <!-- 🎮 3. 게임 플레이 화면 -->
    <div id="game-screen" class="screen hidden">
      <!-- 상대방 영역 -->
      <div class="player-area">
        <div class="player-info">
          <span id="opp-name">상대방</span>
          <span id="opp-hp" class="hp-bar">❤️❤️❤️❤️</span>
        </div>
        <div id="opp-items" class="item-list"></div>
      </div>

      <!-- 중앙 산탄총 및 상태 영역 -->
      <div class="center-area">
        <div class="shotgun-icon">🔫</div>
        <div id="bullet-info" class="bullet-info">실탄: 0 | 공포탄: 0</div>
        <div id="status-text" class="status-text">게임을 불러오는 중...</div>
      </div>

      <!-- 내 영역 및 조작 버튼 -->
      <div class="player-area">
        <div class="player-info">
          <span id="my-name">나</span>
          <span id="my-hp" class="hp-bar">❤️❤️❤️❤️</span>
        </div>
        <div id="my-items" class="item-list"></div>
      </div>

      <div class="action-area">
        <button id="btn-shoot-opp" class="btn-danger" disabled>🎯 상대에게 발사</button>
        <button id="btn-shoot-self" class="btn-danger" disabled>🔄 자신에게 발사</button>
      </div>
    </div>

    <!-- 🏆 4. 게임 결과 화면 (승리/패배) -->
    <div id="result-screen" class="screen hidden" style="justify-content: center; align-items: center; text-align: center; gap: 24px;">
      <h1 id="result-title" class="title" style="font-size: 2.8rem; color: #ff3333;">GAME OVER</h1>
      <p id="result-desc" class="subtitle" style="font-size: 1.1rem;">승패가 결정되었습니다.</p>
      <div class="btn-group" style="margin-top: 20px;">
        <button id="btn-restart" class="btn-primary">🔄 로비로 돌아가기</button>
      </div>
    </div>

    <!-- 📢 5. 라운드 / 턴 안내 배너 오버레이 (오류 방지용 추가) -->
    <div id="announcement-overlay" class="modal hidden" style="background: rgba(0,0,0,0.7); pointer-events: none;">
      <div style="background: rgba(15,15,15,0.95); border: 2px solid #ff1a1a; padding: 20px 40px; border-radius: 12px; box-shadow: 0 0 30px rgba(255,0,0,0.5);">
        <h2 id="announcement-text" style="color: #fff; font-size: 1.5rem; text-align: center;">라운드 시작</h2>
      </div>
    </div>

    <!-- 💬 6. 일반 알림 팝업 모달 -->
    <div id="item-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-title">알림</h3>
        <p id="modal-desc">내용</p>
        <button id="modal-close" class="btn-primary">확인</button>
      </div>
    </div>

    <!-- 🔍 7. 아이템 선택/타겟 지정 모달 -->
    <div id="action-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="action-modal-title">선택</h3>
        <p id="action-modal-desc">대상을 선택하세요</p>
        <div id="action-modal-buttons" class="btn-group">
          <!-- 동적 버튼 생성 영역 -->
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
